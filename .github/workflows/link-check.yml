# Checks the links in README.md and AWESOME.md once a month.
# If any link is broken, it opens an issue listing them.
name: Link check

on:
  schedule:
    - cron: "0 6 1 * *" # 06:00 UTC on the 1st of every month
  workflow_dispatch: # allows a manual run from the Actions tab

jobs:
  link-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --no-progress --max-retries 3 --accept 200,206,429 README.md AWESOME.md
          fail: false

      - name: Open an issue if links are broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Broken links found
          content-filepath: ./lychee/out.md
          labels: broken links
